name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Inject runtime config
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          REWARDED_AD_ID: ${{ vars.REWARDED_AD_ID }}
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          AD_TEST: ${{ vars.AD_TEST }}
        run: |
          if [ -n "$API_BASE_URL" ]; then sed -i "s|__API_BASE__|$API_BASE_URL|g" public/config.js; fi
          if [ -n "$REWARDED_AD_ID" ]; then sed -i "s|__REWARDED_AD_ID__|$REWARDED_AD_ID|g" public/config.js; fi
          if [ "$AD_TEST" = "false" ]; then sed -i "s|window.CQ_AD_TEST = true;|window.CQ_AD_TEST = false;|" public/config.js; fi
          echo '--- config.js ---'
          cat public/config.js

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android config
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
        run: node scripts/patch-android.mjs

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coinrush-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error