name: Coinrush

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Inject runtime config
        env:
          API_BASE_URL: https://localhost-0.tail5bd7b7.ts.net
          ADMOB_APP_ID: ca-app-pub-9652943365143964~2114970865
          REWARDED_AD_ID: ca-app-pub-9652943365143964/1296713218
          AD_TEST: 'true'
        run: |
          set -e

          CONFIG="public/config.js"

          test -f "$CONFIG" || {
            echo "::error::config.js tidak ditemukan"
            exit 1
          }

          export API_BASE_URL ADMOB_APP_ID REWARDED_AD_ID AD_TEST

          node <<'NODE'
          const fs = require('fs');
          const file = 'public/config.js';
          let config = fs.readFileSync(file, 'utf8');

          const values = {
            '__API_BASE__': process.env.API_BASE_URL,
            '__ADMOB_APP_ID__': process.env.ADMOB_APP_ID,
            '__REWARDED_AD_ID__': process.env.REWARDED_AD_ID
          };

          for (const [key, value] of Object.entries(values)) {
            config = config.split(key).join(value);
          }

          config = config.replace(
            /window\.CQ_AD_TEST\s*=\s*(true|false);/,
            `window.CQ_AD_TEST = ${process.env.AD_TEST === 'false' ? 'false' : 'true'};`
          );

          fs.writeFileSync(file, config);
          console.log('Konfigurasi CoinRush berhasil diterapkan.');
          NODE

      - name: Add Android platform
        run: npx cap add android

      - name: Patch Android config
        env:
          ADMOB_APP_ID: ca-app-pub-9652943365143964~2114970865
        run: node scripts/patch-android.mjs

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coinrush-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
