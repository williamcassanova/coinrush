name: Coinrush

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API base URL (contoh: https://host.tailnet.ts.net)'
        required: false
        type: string
      rewarded_ad_id:
        description: 'Rewarded AdMob ad unit ID (kosongkan untuk pakai test ad)'
        required: false
        type: string
      interstitial_ad_id:
        description: 'Interstitial AdMob ad unit ID (kosongkan untuk pakai test ad)'
        required: false
        type: string
      admob_app_id:
        description: 'AdMob App ID'
        required: false
        type: string
      ad_test:
        description: 'true = pakai test ad, false = ad asli'
        required: false
        type: string
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Check API base URL
        env:
          API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
        run: |
          echo "API_BASE_URL=$API_BASE_URL"
          if [ -z "$API_BASE_URL" ]; then
            echo "::error::API_BASE_URL kosong. Isi input 'api_base_url' saat Run workflow, atau set repository variable API_BASE_URL."
            exit 1
          fi

      - name: Inject runtime config
        env:
          API_BASE_URL: ${{ inputs.api_base_url || vars.API_BASE_URL }}
          REWARDED_AD_ID: ${{ inputs.rewarded_ad_id || vars.REWARDED_AD_ID }}
          INTERSTITIAL_AD_ID: ${{ inputs.interstitial_ad_id || vars.INTERSTITIAL_AD_ID }}
          ADMOB_APP_ID: ${{ inputs.admob_app_id || vars.ADMOB_APP_ID }}
          AD_TEST: ${{ inputs.ad_test || vars.AD_TEST }}
        run: |
          if [ -n "$API_BASE_URL" ]; then sed -i "s|__API_BASE__|$API_BASE_URL|g" public/config.js; fi
          if [ -n "$REWARDED_AD_ID" ]; then sed -i "s|__REWARDED_AD_ID__|$REWARDED_AD_ID|g" public/config.js; fi
          if [ -n "$INTERSTITIAL_AD_ID" ]; then sed -i "s|__INTERSTITIAL_AD_ID__|$INTERSTITIAL_AD_ID|g" public/config.js; fi
          if [ "$AD_TEST" = "false" ]; then sed -i "s|window.CQ_AD_TEST = true;|window.CQ_AD_TEST = false;|" public/config.js; fi
          echo '--- config.js ---'
          cat public/config.js

      - name: Add Android platform
        run: npx cap add android

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/coinrush-release.keystore
            echo "RELEASE_STORE_PASS=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=${ANDROID_KEY_ALIAS:-coinrush}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore android/app/coinrush-release.keystore \
              -alias coinrush \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass coinrush -keypass coinrush \
              -dname "CN=Coin Rush, OU=Mobile, O=Coin Rush, L=Jakarta, ST=DKI, C=ID"
            echo "RELEASE_STORE_PASS=coinrush" >> "$GITHUB_ENV"
            echo "RELEASE_KEY_ALIAS=coinrush" >> "$GITHUB_ENV"
          fi

      - name: Patch Android config
        env:
          ADMOB_APP_ID: ${{ inputs.admob_app_id || vars.ADMOB_APP_ID }}
          AD_TEST: ${{ inputs.ad_test || vars.AD_TEST }}
        run: node scripts/patch-android.mjs

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: coinrush-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build release APK
        run: |
          cd android && ./gradlew assembleRelease -x lintVitalRelease --no-daemon --stacktrace

      - name: Sign release APK
        run: |
          ANDROID_SDK=${ANDROID_HOME:-$ANDROID_SDK_ROOT}
          APKSIGNER=$(find "$ANDROID_SDK/build-tools" -name apksigner -type f | sort -V | tail -1)
          ZIPALIGN=$(find "$ANDROID_SDK/build-tools" -name zipalign -type f | sort -V | tail -1)
          "$ZIPALIGN" -f 4 \
            android/app/build/outputs/apk/release/app-release-unsigned.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk
          "$APKSIGNER" sign \
            --ks android/app/coinrush-release.keystore \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass "pass:$RELEASE_STORE_PASS" \
            --key-pass "pass:$RELEASE_STORE_PASS" \
            --out android/app/build/outputs/apk/release/app-release-signed.apk \
            android/app/build/outputs/apk/release/app-release-aligned.apk
          "$APKSIGNER" verify --verbose android/app/build/outputs/apk/release/app-release-signed.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: coinrush-release-apk
          path: android/app/build/outputs/apk/release/app-release-signed.apk
          if-no-files-found: error